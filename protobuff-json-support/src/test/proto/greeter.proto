syntax = "proto3";
package helloworld;

option java_package = "org.example.grpc";
option java_outer_classname = "HelloworldProto";
option java_multiple_files = true;

message HelloRequest {
  string name = 1;
}

message HelloResponse {
  string greeting = 1;
}

service Greeter {
  rpc sayHello (HelloRequest) returns (HelloResponse);
}
