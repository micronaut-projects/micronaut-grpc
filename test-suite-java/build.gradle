plugins {
    id "java"
    // tag::plugin[]
    alias(libs.plugins.protobuf)
    // end::plugin[]
    id "io.micronaut.build.internal.grpc-tests"
}

// tag::variables[]
ext {
    grpcVersion = libs.versions.managed.grpc.asProvider().get()
    protobufVersion = libs.versions.managed.protobuf.asProvider().get()
}
// end::variables[]

// tag::reactive-variables[]
ext {
    reactiveGrpcVersion = libs.versions.reactive.grpc.get()
}
// end::reactive-variables[]

application {
    mainClass = "helloworld.Application"
}

micronaut {
    version.set(libs.versions.micronaut.platform.get())
    coreVersion.set(libs.versions.micronaut.asProvider().get())
    testRuntime "junit5"
    enableNativeImage false
    processing {
        incremental(true)
        annotations("helloworld.*")
    }
}

dependencies {

    annotationProcessor mnValidation.micronaut.validation.processor

    compileOnly libs.managed.grpc.stub
    compileOnly libs.javax.annotation.api

    implementation platform(libs.micronaut.test)
    implementation mnValidation.micronaut.validation
    implementation mn.micronaut.runtime
    implementation projects.micronautGrpcServerRuntime
    implementation libs.micronaut.discovery.client
    implementation libs.managed.grpc.services
    // tag::reactive-dependencies[]
    implementation platform(libs.micronaut.reactor)
    implementation libs.reactive.grpc.stub
    implementation "io.projectreactor:reactor-core"
    // end::reactive-dependencies[]
    implementation mn.snakeyaml

    runtimeOnly mnLogging.logback.classic

    testAnnotationProcessor mnValidation.micronaut.validation.processor

    testCompileOnly libs.javax.annotation.api
    testRuntimeOnly mnLogging.logback.classic
    testCompileOnly libs.managed.protobuf.java
    nativeImageTestCompileOnly(mn.micronaut.http.netty) {
      because("workaround for Netty GraalVM metadata not being compatible")
    }

}

// tag::config[]

sourceSets {
    main {
        java {
            srcDirs 'build/generated/source/proto/main/grpc'
            srcDirs 'build/generated/source/proto/main/java'
        }
    }
}
// end::config[]

// tag::reactive-source-set[]
sourceSets {
    main {
        java {
            srcDirs 'build/generated/source/proto/main/reactor'
        }
    }
}
// end::reactive-source-set[]

// tag::config[]
protobuf {
    protoc { artifact = "com.google.protobuf:protoc:$protobufVersion" }
    plugins {
        grpc { artifact = "io.grpc:protoc-gen-grpc-java:$grpcVersion" }
    }
    generateProtoTasks {
        all()*.plugins {
            grpc {}
        }
    }
}
// end::config[]

// tag::reactive-plugin[]
protobuf {
    plugins {
        reactor { artifact = "com.salesforce.servicelibs:reactor-grpc:$reactiveGrpcVersion" }
    }
}
// end::reactive-plugin[]

// tag::reactive-config[]
protobuf {
    generateProtoTasks {
        all()*.plugins {
            reactor {}
        }
    }
}
// end::reactive-config[]
